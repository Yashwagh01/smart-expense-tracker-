# Spring Boot & Database Configuration
spring.application.name=SmartExpenseTracker
server.port=8080

# SQLite Datasource
spring.datasource.url=jdbc:sqlite:../database/smart_expense_tracker.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Vaadin Flow Configuration
vaadin.launch-browser=false
vaadin.whitelisted-packages=com.smartexpense

# Python AI Module Integration
python.executable=python3
python.scripts.path=../ai
